# The fork's checks (see FORK.md). The hobops-release-branches ruleset requires
# the "api" and "web" jobs, so keep their names stable.
name: ci

on:
  pull_request:
    branches: ["hobops/**"]
  push:
    branches: ["hobops/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:15.7-alpine
        env:
          POSTGRES_USER: plane
          POSTGRES_PASSWORD: plane
          POSTGRES_DB: plane
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U plane"
          --health-interval 5s --health-timeout 5s --health-retries 30
      valkey:
        image: valkey/valkey:7.2.11-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 30
      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 10s --health-retries 30
    env:
      DATABASE_URL: postgresql://plane:plane@localhost:5432/plane
      REDIS_URL: redis://localhost:6379/
      SECRET_KEY: ci-only-not-a-secret
      DJANGO_SETTINGS_MODULE: plane.settings.test
      WEB_URL: http://localhost
      # Plane counts SMTP as configured when EMAIL_HOST is set. Mail goes out
      # through Celery, and nothing consumes the queue here.
      EMAIL_HOST: localhost
      # Every test shares one fixed API key, so the default 60/minute limit
      # turns a fast run into random 429s. No test relies on that limit.
      API_KEY_RATE_LIMIT: 10000/minute
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements/*.txt

      - name: Install dependencies
        working-directory: apps/api
        run: |
          # psycopg-c builds from source and needs libpq's headers.
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libpq-dev
          pip install -r requirements/test.txt ruff==0.17.4

      - name: Lint the fork's Python files
        run: |
          # Upstream's files are linted upstream. This lints what the fork adds
          # or changes relative to the upstream release tag of the work branch.
          branch="${GITHUB_BASE_REF:-$GITHUB_REF_NAME}"
          upstream="${branch#hobops/}"
          git fetch --no-tags --depth=1 origin "refs/tags/${upstream}:refs/tags/${upstream}"
          git diff --name-only --diff-filter=AM "${upstream}" HEAD -- 'apps/api/*.py' > "${RUNNER_TEMP}/fork-py.txt"
          cat "${RUNNER_TEMP}/fork-py.txt"
          if [ -s "${RUNNER_TEMP}/fork-py.txt" ]; then
            xargs ruff check --force-exclude < "${RUNNER_TEMP}/fork-py.txt"
          fi

      - name: Migrations match the models
        working-directory: apps/api
        run: python manage.py makemigrations --check --dry-run

      - name: Migrations apply to an empty database
        working-directory: apps/api
        run: python manage.py migrate --noinput

      - name: Backend tests
        working-directory: apps/api
        run: >-
          python -m pytest -p no:cacheprovider -o addopts=""
          --strict-markers --create-db --nomigrations -q -rfE plane/tests

  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      NODE_OPTIONS: --max-old-space-size=8192
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Locate the pnpm store
        run: echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and format of web and its packages
        run: pnpm turbo run check:lint check:format --filter=web...

      - name: Types of the apps
        run: pnpm turbo run check:types --filter=web --filter=space --filter=admin --filter=live

      - name: Build web
        run: pnpm turbo run build --filter=web
